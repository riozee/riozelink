#:schema node_modules/wrangler/config-schema.json
name = "riozelink-relay"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# One Durable Object per room. Rooms live in memory for as long as two ends are parked in them.
[durable_objects]
bindings = [{ name = "ROOMS", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = false
